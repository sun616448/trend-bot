[project]
name = "trend-bot"
version = "0.1.0"
description = "Weekly consumer, digital and marketing trend digest built from free public sources"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
trendbot = "trendbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trendbot"]
